name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov
      - name: Run unit tests
        run: pytest --cov=rawfilereader --cov-report=term-missing

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify bundled DLLs
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          required = {
              "OpenMcdf.dll",
              "OpenMcdf.Extensions.dll",
              "ThermoFisher.CommonCore.Data.dll",
              "ThermoFisher.CommonCore.RawFileReader.dll",
              "ThermoFisher.CommonCore.BackgroundSubtraction.dll",
          }
          with zipfile.ZipFile(wheel) as archive:
              bundled = {Path(name).name for name in archive.namelist() if name.endswith(".dll")}
          missing = required - bundled
          if missing:
              raise SystemExit(f"Wheel is missing DLLs: {sorted(missing)}")
          PY
